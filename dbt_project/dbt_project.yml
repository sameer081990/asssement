name: podcast_events
version: "1.0.0"
config-version: 2
profile: podcast_events

# Paths are relative to the directory dbt is run from (dbt_project/).
# pipeline/run_pipeline.py overrides them with absolute paths.
vars:
  users_csv: "../data/raw/users.csv"
  episodes_csv: "../data/raw/episodes.csv"
  # Reject-rate threshold used by the batch quality gate (tests/assert_reject_rate_below_threshold.sql)
  max_reject_rate: 0.10
  min_event_date: "2020-01-01"

models:
  podcast_events:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
